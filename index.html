<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous" defer></script>
<style>
:root{
  --green:oklch(0.52 0.11 150); --green-dark:oklch(0.40 0.09 150); --green-soft:oklch(0.95 0.02 150);
  --amber:oklch(0.75 0.14 75); --amber-soft:oklch(0.95 0.04 80); --amber-text:oklch(0.55 0.12 70);
  --ink:oklch(0.25 0.02 150); --ink-2:oklch(0.48 0.02 150); --ink-3:oklch(0.62 0.015 150);
  --bg:oklch(0.985 0.005 140); --card:#fff; --line:oklch(0.91 0.01 145);
  --radius:14px; --shadow:0 2px 10px rgba(20,40,25,.10), 0 1px 2px rgba(20,40,25,.06);
  --font-display:"Bricolage Grotesque", system-ui, sans-serif;
  --ease:cubic-bezier(.3,.9,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
a{color:var(--green);text-decoration:none}
a:hover{color:var(--green-dark);text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
h1,h2,h3{font-family:var(--font-display);margin:0}
svg{flex:none;vertical-align:-2px}
.rate,.gdot,.stars{display:inline-flex;align-items:center;gap:3px}
:focus-visible{outline:2.5px solid var(--green-dark);outline-offset:2px;border-radius:6px}
.leaflet-marker-icon:focus-visible{outline-offset:1px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#app{display:grid;height:100dvh;grid-template-rows:auto auto 1fr;position:relative}
/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);z-index:1002;position:relative}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--green-dark)}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center}
/* Site nav: Map (here) and the park guides. On phones only the Guides link
   shows, as a pill at the end of the bar; on desktop both sit by the logo. */
.nav{display:flex;gap:4px;order:3;flex:none}
.nav a{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--green);font-weight:650;font-size:14px;color:var(--green-dark);white-space:nowrap;text-decoration:none}
.nav a:hover{background:var(--green-soft);text-decoration:none;color:var(--green-dark)}
.nav a[aria-current="page"]{display:none}
@media(max-width:379px){.logo>span:last-child{display:none}}
.searchwrap{flex:1;position:relative;max-width:520px}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;transition:border-color .15s}
.searchbox:focus-within{border-color:var(--green)}
.searchbox input{border:none;background:none;outline:none;font:inherit;width:100%;color:var(--ink)}
.searchbox input::placeholder{color:var(--ink-3)}
.suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:none;z-index:1005}
.suggest.open{display:block}
.suggest button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 14px;font-size:14px}
.suggest button:hover,.suggest button.active{background:var(--green-soft)}
.suggest button:focus-visible{outline-offset:-3px}
.suggest .zip{color:var(--ink-3);font-size:12.5px;margin-left:auto}
/* ---------- chips row ---------- */
.chipsrow{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;z-index:1001;position:relative}
.chipsrow::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500;color:var(--ink-2);transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--green)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.filterbtn{border-color:var(--ink);color:var(--ink);font-weight:600}
.chip.filterbtn.active{background:var(--green-dark);border-color:var(--green-dark);color:#fff}
.chip .count{background:var(--amber);color:var(--ink);border-radius:999px;font-size:11px;font-weight:700;padding:1px 6px}
/* ---------- main ---------- */
.main{position:relative;overflow:hidden}
#map{position:absolute;inset:0;z-index:1}
.leaflet-container{font:inherit}
/* pins */
.pin{filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));transition:transform .12s}
.pin:hover{transform:scale(1.12)}
.pin.sel{transform:scale(1.18)}
/* ---------- sheet / sidebar ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:900;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -4px 24px rgba(20,40,25,.18);transform:translateY(calc(100% - 56px));transition:transform .3s var(--ease);display:flex;flex-direction:column;max-height:78%}
.sheet.open{transform:translateY(0)}
.sheet.dragging{transition:none}
.sheet-head{padding:8px 18px 10px;flex:none;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.sheet-head:focus-visible{outline-offset:-3px}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.sheet-title{display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
.sheet-title h2{font-size:16px;font-weight:700;flex:none}
.sheet-title span{color:var(--ink-3);font-size:13px;overflow:hidden;text-overflow:ellipsis}
/* min-height:0 — without it the flex item's automatic minimum size is its
   content height, so it never overflows and never scrolls. */
.sheet-body{overflow-y:auto;padding:0 14px 20px;overscroll-behavior:contain;min-height:0}
/* featured strip */
.feat-h{display:flex;align-items:center;gap:7px;margin:8px 2px 10px;font-family:var(--font-display);font-weight:700;font-size:14.5px;color:var(--amber-text)}
.list-h{display:flex;align-items:center;gap:7px;margin:18px 2px 10px;font-family:var(--font-display);font-weight:700;font-size:14.5px;color:var(--ink-2)}
.feat-more{display:block;margin:9px 2px 0;font-size:13px;font-weight:600;color:var(--amber-text);text-decoration:underline;text-underline-offset:2px}
.feat-more:hover{color:var(--ink)}
/* ---------- cards ---------- */
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:border-color .15s, box-shadow .15s;text-align:left;width:100%}
.card:hover{border-color:var(--green);box-shadow:var(--shadow)}
.card.featured{border-color:oklch(0.85 0.08 80);background:linear-gradient(0deg,var(--amber-soft),var(--card) 55%)}
.thumb{width:86px;height:86px;flex:none;border-radius:10px;overflow:hidden;position:relative;background:var(--bg)}
.thumb img,.d-hero img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;background:repeating-linear-gradient(45deg,oklch(0.93 0.015 150),oklch(0.93 0.015 150) 8px,oklch(0.955 0.01 150) 8px,oklch(0.955 0.01 150) 16px);color:var(--ink-3);font:500 9.5px ui-monospace,Menlo,monospace;text-align:center;padding:4px}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card-top{display:flex;align-items:center;gap:6px}
.card-name{font-weight:650;font-size:14.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pawbadge{flex:none;width:18px;height:18px;border-radius:50%;background:var(--amber);display:grid;place-items:center}
.meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.rate{font-weight:600;color:var(--ink)}
.gdot{font-size:11px;color:var(--ink-3)}
.unrated{color:var(--ink-3);font-style:italic}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.fb{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px}
.fb.full{background:var(--green-soft);color:var(--green-dark)}
.fb.patio{background:var(--amber-soft);color:var(--amber-text)}
.amset{display:flex;gap:4px}
/* Amenity chips are colour-coded per amenity. Each .am-* sets the trio of
   custom properties; everything else reads them, so the list, the detail grid
   and any future surface stay in step. */
.am{width:20px;height:20px;border-radius:6px;background:var(--am-bg,var(--bg));border:1px solid var(--am-br,var(--line));display:grid;place-items:center;color:var(--am-fg,var(--ink-2))}
.am-water   {--am-fg:oklch(0.52 0.14 245);--am-bg:oklch(0.955 0.03 245);--am-br:oklch(0.89 0.05 245)}
.am-menu    {--am-fg:oklch(0.47 0.12 150);--am-bg:oklch(0.955 0.03 150);--am-br:oklch(0.88 0.05 150)}
.am-shade   {--am-fg:oklch(0.55 0.15 25); --am-bg:oklch(0.955 0.03 25); --am-br:oklch(0.89 0.05 25)}
.am-treats  {--am-fg:oklch(0.58 0.15 65); --am-bg:oklch(0.955 0.04 70); --am-br:oklch(0.89 0.06 70)}
.am-offleash{--am-fg:oklch(0.52 0.11 195);--am-bg:oklch(0.955 0.03 195);--am-br:oklch(0.88 0.05 195)}
.am-beds    {--am-fg:oklch(0.52 0.13 300);--am-bg:oklch(0.955 0.03 300);--am-br:oklch(0.89 0.04 300)}
.am-fenced  {--am-fg:oklch(0.50 0.09 265);--am-bg:oklch(0.955 0.025 265);--am-br:oklch(0.89 0.04 265)}
.am-smalldog{--am-fg:oklch(0.56 0.14 350);--am-bg:oklch(0.955 0.03 350);--am-br:oklch(0.89 0.05 350)}
.am-wash    {--am-fg:oklch(0.53 0.11 215);--am-bg:oklch(0.955 0.03 215);--am-br:oklch(0.88 0.05 215)}
.am-raw     {--am-fg:oklch(0.52 0.12 45); --am-bg:oklch(0.95 0.035 45); --am-br:oklch(0.88 0.055 45)}
/* ---------- preview card (mobile map tap) ---------- */
.preview{position:absolute;left:12px;right:12px;bottom:68px;z-index:950;transform:translateY(140%);transition:transform .25s var(--ease), visibility 0s .25s;visibility:hidden}
.preview.show{transform:none;visibility:visible;transition:transform .25s var(--ease), visibility 0s}
.preview .card{box-shadow:0 6px 24px rgba(20,40,25,.22)}
/* ---------- filter panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,30,20,.4);z-index:1100;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.fpanel{position:fixed;left:0;right:0;bottom:0;z-index:1101;background:var(--card);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s var(--ease), visibility 0s .28s;visibility:hidden;max-height:85dvh;display:flex;flex-direction:column}
.fpanel.show{transform:none;visibility:visible;transition:transform .28s var(--ease), visibility 0s}
.fpanel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;flex:none}
.fpanel-head h2{font-size:18px}
.fpanel-body{overflow-y:auto;padding:0 18px;overscroll-behavior:contain}
.fgroup{padding:14px 0;border-top:1px solid var(--line)}
.fgroup h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin-bottom:10px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:13.5px;font-weight:500;color:var(--ink-2);transition:all .12s}
.opt:hover{border-color:var(--green)}
.opt.on{background:var(--green);border-color:var(--green);color:#fff}
.opt.amber-on{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.fpanel-foot{display:flex;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none}
.btn{border-radius:12px;padding:12px 18px;font-weight:650;font-size:14.5px;transition:all .15s;white-space:nowrap}
.btn.ghost{color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink)}
.btn.primary{background:var(--green);color:#fff;flex:1;text-align:center}
.btn.primary:hover{background:var(--green-dark)}
/* ---------- detail ---------- */
.detail{position:fixed;inset:0;z-index:1200;background:var(--card);transform:translateY(100%);transition:transform .3s var(--ease), visibility 0s .3s;visibility:hidden;overflow-y:auto;overscroll-behavior:contain}
.detail.show{transform:none;visibility:visible;transition:transform .3s var(--ease), visibility 0s}
.d-hero{position:relative;height:210px;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:3px}
.d-hero .ph.tall{grid-row:1/3}
/* One real photo fills the hero; the striped placeholder grid is the fallback. */
.d-hero.one{grid-template-columns:1fr;grid-template-rows:1fr;gap:0}
.d-credit{max-width:720px;margin:0 auto;padding:8px 18px 0;font-size:11.5px;color:var(--ink-3)}
.d-credit a{color:var(--ink-3);text-decoration:underline;text-underline-offset:2px}
.d-credit a:hover{color:var(--green-dark)}
.d-close{position:absolute;top:14px;left:14px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.94);box-shadow:var(--shadow);display:grid;place-items:center;z-index:2}
.d-body{padding:18px;max-width:720px;margin:0 auto}
.d-title{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.d-title h2{font-size:23px;letter-spacing:-.02em}
.featpill{display:inline-flex;align-items:center;gap:6px;background:var(--amber);color:var(--ink);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.d-meta{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--ink-2);font-size:14px;flex-wrap:wrap}
.d-banner{display:flex;gap:11px;align-items:flex-start;margin:16px 0;padding:13px 14px;border-radius:12px;font-size:14px}
.d-banner.full{background:var(--green-soft);color:var(--green-dark)}
.d-banner.patio{background:var(--amber-soft);color:var(--amber-text)}
.d-banner b{display:block;font-size:14.5px}
.d-banner .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fff}
.d-banner .ic svg{width:17px;height:17px}
.d-sec{margin:20px 0}
.d-sec h3{font-size:16px;margin-bottom:10px}
.amgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.amitem{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;font-weight:500}
.amitem .am{width:26px;height:26px;border:none}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.photos .ph,.photos img{height:96px;border-radius:10px}
.photos img{width:100%;object-fit:cover;display:block}
.srcnote{font-size:12px;color:var(--ink-3);margin-top:8px}
.review{padding:13px 0;border-top:1px solid var(--line)}
.review:first-of-type{border-top:none}
.r-head{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--green-soft);color:var(--green-dark);display:grid;place-items:center;font-weight:700;font-size:13px}
.r-name{font-weight:600;font-size:13.5px}
.r-sub{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.gbadge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.stars{gap:1px}
.review p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.d-actions{display:flex;gap:10px;margin:18px 0 8px}
.d-actions .btn{flex:1;text-align:center;border:1.5px solid var(--line)}
.d-actions .btn.primary{border-color:var(--green)}
/* ---------- empty ---------- */
.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}
/* ---------- desktop ---------- */
.deskonly{display:none}
@media(min-width:1024px){
  #app{grid-template-rows:auto 1fr;grid-template-columns:440px 1fr}
  .topbar{grid-column:1/3;padding:12px 20px}
  .nav{order:0;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;margin-right:6px}
  .nav a{border:none;color:var(--ink-2)}
  .nav a[aria-current="page"]{display:inline-flex;background:var(--green);color:#fff}
  .nav a:not([aria-current]):hover{background:none;color:var(--ink)}
  .chipsrow{display:none}
  .main{grid-column:2}
  /* Same reason as .sheet-body: the grid item has to be allowed to shrink
     below its content height, or the list runs off the bottom of the viewport
     with no way to scroll it. */
  .sheet{position:static;grid-column:1;grid-row:2;transform:none !important;max-height:none;min-height:0;border-radius:0;border-right:1px solid var(--line);box-shadow:none}
  .sheet-head{cursor:default;padding-top:14px;touch-action:auto}
  .grabber{display:none}
  .deskonly{display:flex}
  .desk-chips{gap:8px;align-items:center;flex-wrap:wrap;padding:0 4px 12px}
  .preview{display:none}
  .fpanel{left:auto;right:auto;bottom:auto;top:118px;width:440px;margin-left:20px;border-radius:16px;box-shadow:0 12px 40px rgba(20,40,25,.25);max-height:calc(100dvh - 160px)}
  .fpanel:not(.show){display:none}
  .detail{left:50%;top:50%;bottom:auto;right:auto;width:min(760px,92vw);max-height:88dvh;transform:translate(-50%,-50%) scale(.97);opacity:0;pointer-events:none;border-radius:20px;box-shadow:0 24px 80px rgba(15,30,20,.4);transition:opacity .2s, transform .2s, visibility 0s .2s}
  .detail.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;transition:opacity .2s, transform .2s, visibility 0s}
  .d-hero{height:250px;border-radius:20px 20px 0 0;overflow:hidden}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  .pin:hover,.pin.sel{transform:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">

   to a no-op map object and say so in the map pane. */
const hasLeaflet = typeof L !== 'undefined';
const map = hasLeaflet
  ? L.map('map',{zoomControl:false}).setView([state.center.lat,state.center.lng],6)
  : {on(){},flyTo(){},setView(){},invalidateSize(){}};
if(hasLeaflet){
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
} else {
  $('map').innerHTML = '<div class="empty" style="padding-top:80px"><b>Map unavailable</b>The map library could not be loaded. The list below still works.</div>';
  if(!DESKTOP.matches) requestAnimationFrame(()=>setSheet(true));
}

const markers = new Map();
const pinSize = p => p.featured ? 40 : 32;
function pinHtml(p, sel){
  const feat = p.featured;
  const bg = feat ? 'oklch(0.75 0.14 75)' : (p.friendly==='full' ? 'oklch(0.52 0.11 150)' : '#fff');
  const fg = feat ? 'oklch(0.30 0.05 75)' : (p.friendly==='full' ? '#fff' : 'oklch(0.52 0.11 150)');
  const size = pinSize(p);
  const border = p.friendly==='patio' && !feat ? 'border:2.5px solid oklch(0.52 0.11 150);' : '';
  const glyph = feat ? PAW(fg,20) : TICON(p.type,fg,15);
  return `<div class="pin ${sel?'sel':''}" style="width:${size}px;height:${size}px;border-radius:50% 50% 50% 4px;transform-origin:bottom left;background:${bg};${border}display:grid;place-items:center;rotate:0deg">${glyph}</div>`;
}
function iconFor(p, sel){
  const s = pinSize(p);
  return L.divIcon({className:'', html:pinHtml(p, sel), iconSize:[s,s], iconAnchor:[s/2,s]});
}
/* Reconcile markers with the filtered list instead of tearing them all down. */
function renderMarkers(list){
  if(!hasLeaflet) return;
  const keep = new Set(list.map(p=>p.id));
  markers.forEach((m,id)=>{ if(!keep.has(id)){ m.remove(); markers.delete(id); } });
  list.forEach(p=>{
    if(markers.has(p.id)) return;
    const m = L.marker([p.lat,p.lng],{
      icon:iconFor(p, state.selected===p.id),
      zIndexOffset:p.featured?500:0,
      keyboard:true,
      title:`${p.name} — ${TYPES[p.type]}`,
      alt:`${p.name}, ${TYPES[p.type]}, ${p.friendly==='full'?'dog-friendly inside and outside':'patio only'}`
    });
    m.on('click',()=>selectPlace(p.id));
    m.addTo(map);
    const el = m.getElement();
    if(el){ el.setAttribute('role','button'); el.setAttribute('aria-label',`${p.name}, ${TYPES[p.type]}, ${p.friendly==='full'?'dog-friendly inside and outside':'patio only'}`); }
    markers.set(p.id,m);
  });
}

/* ============ helpers ============ */
const dist = p => {
  const R=3959, dLat=(p.lat-state.center.lat)*Math.PI/180, dLng=(p.lng-state.center.lng)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(state.center.lat*Math.PI/180)*Math.cos(p.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
};
const fmtDist = d => d<10 ? d.toFixed(1)+' mi' : Math.round(d)+' mi';
function filtered(){
  return PLACES.filter(p=>
    (!state.types.size || state.types.has(p.type)) &&
    (state.friendly==='any' || p.friendly===state.friendly) &&
    [...state.amen].every(a=>p.amen.includes(a)) &&
    // Unrated places can't satisfy a minimum rating, but must survive "Any".
    (!state.minRating || (p.rating != null && p.rating >= state.minRating)) &&
    (!state.maxDist || dist(p)<=state.maxDist)
  ).sort((a,b)=>dist(a)-dist(b));
}
/* "Inside + outside" makes no sense for a park or a shop, so the wording follows
   the place type. The two colour treatments stay: green = dogs anywhere on site,
   amber = outdoors only. */
const CHECK = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg>`;
function friendlyInfo(p){
  if(p.type==='park') return {cls:'full', icon:ICONS.offleash, label:'Off-leash park',
    title:'Off-leash park', body:'Dogs can run off-leash here.'};
  if(p.type==='store') return {cls:'full', icon:CHECK, label:'Dogs welcome inside',
    title:'Dogs welcome inside', body:'Leashed dogs can come in and shop with you.'};
  if(p.friendly==='full') return {cls:'full', icon:CHECK, label:'Inside + outside',
    title:'Fully dog-friendly', body:'Dogs are welcome inside and outside.'};
  return {cls:'patio', icon:ICONS.shade, label:'Patio only',
    title:'Patio only', body:'Dogs are welcome on the outdoor patio, but not inside.'};
}
const friendlyBadge = p => { const f = friendlyInfo(p); return `<span class="fb ${f.cls}">${f.icon}${f.label}</span>`; };

/* ============ cards / list ============ */
function cardHtml(p){
  return `<button class="card ${p.featured?'featured':''}" data-id="${p.id}">
    <div class="thumb">${p.photo
      ? `<img src="photos/${p.photo}-thumb.jpg" alt="" width="240" height="240" loading="lazy" decoding="async">`
      : `<div class="ph">photo<br>${esc(p.name.split(' ')[0].toLowerCase())}</div>`}</div>
    <div class="card-body">
      <div class="card-top"><span class="card-name">${esc(p.name)}</span>${p.featured?`<span class="pawbadge" title="Featured: most dog-friendly" role="img" aria-label="Featured: most dog-friendly">${PAW('oklch(0.30 0.05 75)',11)}</span>`:''}</div>
      <div class="meta">${p.rating != null
        ? `<span class="rate" aria-label="Rated ${p.rating} out of 5">${STAR(1,12)}${p.rating}</span><span class="gdot" role="img" aria-label="${p.reviews.toLocaleString()} Google reviews">(${p.reviews.toLocaleString()}) ${G}</span>`
        : `<span class="unrated">Not rated yet</span>`}<span aria-hidden="true">·</span><span class="rate" style="font-weight:500;color:var(--ink-2)">${TICON(p.type,'currentColor',12)}${TYPES[p.type]}</span><span aria-hidden="true">·</span><span>${fmtDist(dist(p))}</span></div>
      <div class="badges">${friendlyBadge(p)}<span class="amset">${p.amen.map(a=>`<span class="am am-${a}" title="${AMEN[a]}" role="img" aria-label="${AMEN[a]}">${ICONS[a]}</span>`).join('')}</span></div>
    </div>
  </button>`;
}
function renderList(){
  const list = filtered();
  const feats = list.filter(p=>p.featured);
  const rest = list.filter(p=>!p.featured);

  // The map still shows every featured pin; only the list is capped.
  const featShown = state.allFeat ? feats : feats.slice(0,FEAT_CAP);
  $('featwrap').innerHTML = feats.length ? `
    <div class="feat-h">${PAW('oklch(0.65 0.13 70)',15)}Most dog-friendly — the amber paw list</div>
    <div class="cards">${featShown.map(cardHtml).join('')}</div>
    ${feats.length>FEAT_CAP ? `<button class="feat-more" id="featmore" aria-expanded="${state.allFeat}">${state.allFeat?'Show fewer':`Show all ${feats.length}`}</button>` : ''}` : '';
  $('allhead').style.display = rest.length ? 'flex' : 'none';
  $('cards').innerHTML = rest.length ? rest.map(cardHtml).join('') :
    (list.length?'':'<div class="empty"><b>No places match</b>Try widening your filters or searching a different area.</div>');

  const countText = `${list.length} place${list.length===1?'':'s'}${state.centerLabel?` near ${state.centerLabel}`:' across California'}`;
  $('listcount').textContent = countText;
  $('live').textContent = countText;

  // Drop a selection that just got filtered out; otherwise keep the preview
  // card in sync (distances change when the search area moves).
  if(state.selected!==null && !list.some(p=>p.id===state.selected)) clearSelection();
  else if(state.selected!==null) $('preview').innerHTML = cardHtml(byId.get(state.selected));
  renderMarkers(list);
}
/* One delegated handler covers featured, main list and the mobile preview card. */
function onCardClick(e){
  if(e.target.closest('#featmore')){ state.allFeat = !state.allFeat; renderList(); return; }
  const card = e.target.closest('.card[data-id]');
  if(card) openDetail(+card.dataset.id);
}
$('sheetbody').addEventListener('click', onCardClick);
$('preview').addEventListener('click', onCardClick);

/* ============ selection / preview ============ */
function setMarkerSelected(id, sel){
  const m = markers.get(id), p = byId.get(id);
  if(m && p) m.setIcon(iconFor(p, sel));
}
function clearSelection(){
  if(state.selected!==null) setMarkerSelected(state.selected,false);
  state.selected = null;
  $('preview').classList.remove('show');
}
function selectPlace(id){
  const p = byId.get(id);
  if(!p) return;
  if(state.selected!==null && state.selected!==id) setMarkerSelected(state.selected,false);
  state.selected = id;
  setMarkerSelected(id,true);

  const pv = $('preview');
  pv.innerHTML = cardHtml(p);
  pv.classList.add('show');
  if(DESKTOP.matches) openDetail(id);
}
map.on('click',clearSelection);

/* ============ detail ============ */
let lastFocus = null;
function detailHtml(p){
  // Every place is a real business now, so there are no reviews to show until a
  // reviews source is connected. Nothing here invents them.
  return `
    <div class="d-hero${p.photo?' one':''}">
      <button class="d-close" id="dclose" aria-label="Close place details"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      ${p.photo
        ? `<img src="photos/${p.photo}.jpg" alt="${esc(p.alt)}" decoding="async">`
        : `<div class="ph tall">photo — exterior</div><div class="ph">photo — patio</div><div class="ph">user photo — pup visit</div>`}
    </div>
    ${p.credit ? `<div class="d-credit">Photo: ${esc(p.credit.a)} · ${esc(p.credit.l)} · <a href="${esc(p.credit.u)}" target="_blank" rel="noopener">Wikimedia Commons</a></div>` : ''}
    <div class="d-body">
      <div class="d-title"><h2>${esc(p.name)}</h2>${p.featured?`<span class="featpill">${PAW('oklch(0.30 0.05 75)',12)}Featured</span>`:''}</div>
      <div class="d-meta">${p.rating != null
        ? `<span class="rate" aria-label="Rated ${p.rating} out of 5">${STAR(1,14)}<b>${p.rating}</b></span><span class="gdot">${p.reviews.toLocaleString()} Google reviews</span>`
        : `<span class="unrated">Not rated yet</span>`}<span aria-hidden="true">·</span><span class="rate" style="font-weight:500;color:var(--ink-2)">${TICON(p.type,'currentColor',14)}${TYPES[p.type]}</span><span aria-hidden="true">·</span><span>${esc(p.city)} — ${fmtDist(dist(p))}</span></div>
      <div class="d-banner ${friendlyInfo(p).cls}">
        <span class="ic" style="color:${friendlyInfo(p).cls==='full'?'oklch(0.45 0.1 150)':'oklch(0.55 0.12 70)'}">${friendlyInfo(p).icon}</span>
        <div><b>${friendlyInfo(p).title}</b>${friendlyInfo(p).body}</div>
      </div>
      <p style="margin:0;color:var(--ink-2)">${esc(p.blurb)}</p>
      ${p.fee ? `<div class="d-sec"><h3>Pet fee &amp; limits</h3><div class="amitem" style="display:inline-flex"><span class="am am-beds">${ICONS.beds}</span>${esc(p.fee)}</div></div>` : ''}
      ${p.amen.length ? `<div class="d-sec"><h3>Dog amenities</h3><div class="amgrid">${p.amen.map(a=>`<div class="amitem"><span class="am am-${a}">${ICONS[a]}</span>${AMEN[a]}</div>`).join('')}</div></div>` : ''}
      <div class="d-sec"><h3>Photos</h3>
        <div class="photos">${p.photo ? `<img src="photos/${p.photo}-thumb.jpg" alt="${esc(p.alt)}" loading="lazy" decoding="async">` : ''}<div class="ph">user photo</div><div class="ph">user photo</div><div class="ph">google photo</div></div>
        <div class="srcnote">${p.credit ? 'Photo via Wikimedia Commons. ' : ''}User uploads and Google Maps photos will appear here too.</div>
      </div>
      <div class="d-sec"><h3>Reviews</h3>
        <div class="empty" style="padding:20px 12px"><b>No reviews yet</b>Reviews will appear here once a reviews source is connected.</div>
      </div>
      <div class="d-actions">
        <button class="btn primary" style="background:var(--green);color:#fff">Directions</button>
        <button class="btn">Website</button>
        <button class="btn">Add photo</button>
      </div>
      <div class="srcnote" style="text-align:center;padding-bottom:10px">${esc(p.addr)}</div>
    </div>`;
}
function openDetail(id){
  const p = byId.get(id);
  if(!p) return;
  const d = $('detail');
  lastFocus = document.activeElement;
  d.innerHTML = detailHtml(p);
  d.setAttribute('aria-label', `${p.name} — place details`);
  d.classList.add('show');
  d.scrollTop = 0;
  $('dclose').addEventListener('click',closeDetail);
  $('dclose').focus({preventScroll:true});
}
function closeDetail(){
  const d = $('detail');
  if(!d.classList.contains('show')) return;
  d.classList.remove('show');
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
  lastFocus = null;
}
$('detail').addEventListener('click',e=>{ if(DESKTOP.matches && e.target.id==='detail') closeDetail(); });

/* ============ chips (type filters) ============ */
function chipSet(containerId){
  const c = $(containerId);
  const mk = (t,label)=>{
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.type = t === null ? '' : t;
    b.setAttribute('aria-pressed','false');
    b.innerHTML = t===null ? label : TICON(t,'currentColor',13)+label;
    b.addEventListener('click',()=>{
      if(t===null) state.types.clear();
      else state.types.has(t)?state.types.delete(t):state.types.add(t);
      syncChips(); renderList();
    });
    c.appendChild(b);
  };
  mk(null,'All');
  // Only offer a type that something in the data actually is — otherwise the
  // chip is a guaranteed empty result. Reappears on its own when data arrives.
  Object.entries(TYPES).filter(([t])=>PLACES.some(p=>p.type===t)).forEach(([t,l])=>mk(t,l+'s'));
}
function syncChips(){
  document.querySelectorAll('.chip[data-type]').forEach(b=>{
    const t = b.dataset.type;
    const on = t === '' ? !state.types.size : state.types.has(t);
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  });
  const n = (state.friendly!=='any') + state.amen.size + (state.minRating>0) + (state.maxDist>0);
  ['fcount-m','fcount-d'].forEach(id=>{const el=$(id); el.style.display=n?'':'none'; el.textContent=n;});
  ['filterbtn-m','filterbtn-d'].forEach(id=>{
    const el = $(id);
    el.classList.toggle('active',n>0);
    el.setAttribute('aria-label', n ? `Filters, ${n} active` : 'Filters');
  });
}
chipSet('chipsrow'); chipSet('deskchips');
// keep the mobile filter button at the head of the scrolling chip row
$('chipsrow').prepend($('filterbtn-m'));

/* ============ filter panel ============ */
function optRow(containerId, options, get, set, multi){
  const c = $(containerId); c.innerHTML='';
  const buttons = [];
  const syncAll = () => buttons.forEach(b=>b.sync());
  options.forEach(([val,label])=>{
    const b = document.createElement('button');
    b.className='opt'; b.type='button'; b.textContent=label;
    b.setAttribute('role', multi ? 'checkbox' : 'radio');
    b.sync = ()=>{
      const on = multi ? get().has(val) : get()===val;
      b.classList.toggle('on', on);
      b.setAttribute('aria-checked', String(on));
    };
    b.addEventListener('click',()=>{ set(val); syncAll(); });
    b.sync();
    buttons.push(b);
    c.appendChild(b);
  });
}
function renderFilterPanel(){
  optRow('f-friendly',[['any','Any'],['full','Inside + outside'],['patio','Patio OK']],()=>draft.friendly,v=>draft.friendly=v,false);
  optRow('f-amen',Object.entries(AMEN).filter(([a])=>PLACES.some(p=>p.amen.includes(a))),()=>draft.amen,v=>draft.amen.has(v)?draft.amen.delete(v):draft.amen.add(v),true);
  optRow('f-rating',[[0,'Any'],[4,'4.0+'],[4.5,'4.5+']],()=>draft.minRating,v=>draft.minRating=v,false);
  // Nothing is rated until a reviews source is connected, so hide the whole
  // group rather than offering filters that can only return nothing.
  $('f-rating').closest('.fgroup').style.display = PLACES.some(p=>p.rating!=null) ? '' : 'none';
  optRow('f-dist',[[0,'Any'],[5,'5 mi'],[10,'10 mi'],[25,'25 mi'],[50,'50 mi'],[100,'100 mi']],()=>draft.maxDist,v=>draft.maxDist=v,false);
  $('distnote').textContent = state.centerLabel ? `Measured from ${state.centerLabel}` : 'Measured from the middle of the map — search an area to refine';
}
let filterOpener = null;
function filtersOpen(){ return $('fpanel').classList.contains('show'); }
function openFilters(e){
  draft.friendly=state.friendly; draft.amen=new Set(state.amen); draft.minRating=state.minRating; draft.maxDist=state.maxDist;
  renderFilterPanel();
  filterOpener = e && e.currentTarget;
  $('fpanel').classList.add('show');
  $('scrim').classList.add('show');
  ['filterbtn-m','filterbtn-d'].forEach(id=>$(id).setAttribute('aria-expanded','true'));
  $('fclose').focus({preventScroll:true});
}
function closeFilters(){
  if(!filtersOpen()) return;
  $('fpanel').classList.remove('show');
  $('scrim').classList.remove('show');
  ['filterbtn-m','filterbtn-d'].forEach(id=>$(id).setAttribute('aria-expanded','false'));
  if(filterOpener && document.contains(filterOpener) && filterOpener.offsetParent!==null) filterOpener.focus({preventScroll:true});
  filterOpener = null;
}
$('filterbtn-m').addEventListener('click',openFilters);
$('filterbtn-d').addEventListener('click',openFilters);
$('fclose').addEventListener('click',closeFilters);
$('scrim').addEventListener('click',closeFilters);
$('fclear').addEventListener('click',()=>{draft.friendly='any';draft.amen.clear();draft.minRating=0;draft.maxDist=0;renderFilterPanel();});
$('fapply').addEventListener('click',()=>{
  state.friendly=draft.friendly; state.amen=new Set(draft.amen); state.minRating=draft.minRating; state.maxDist=draft.maxDist;
  closeFilters(); syncChips(); renderList();
});
/* keep Tab inside whichever modal surface is open */
function trap(container, e){
  const f = [...container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
    .filter(el=>!el.disabled && el.offsetParent!==null);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

/* ============ search ============ */
const searchEl=$('search'), suggestEl=$('suggest');
let hits = [], active = -1;
function closeSuggest(){
  suggestEl.classList.remove('open');
  searchEl.setAttribute('aria-expanded','false');
  searchEl.removeAttribute('aria-activedescendant');
  active = -1;
}
function setActive(i){
  const opts = [...suggestEl.querySelectorAll('button[data-i]')];
  if(!opts.length) return;
  active = (i + opts.length) % opts.length;
  opts.forEach((b,n)=>{ b.classList.toggle('active',n===active); b.setAttribute('aria-selected',String(n===active)); });
  searchEl.setAttribute('aria-activedescendant', opts[active].id);
  opts[active].scrollIntoView({block:'nearest'});
}
function goArea(a){
  state.center={lat:a.lat,lng:a.lng}; state.centerLabel=a.q;
  searchEl.value=`${a.q}, CA`;
  closeSuggest();
  if(REDUCED.matches) map.setView([a.lat,a.lng],a.z);
  else map.flyTo([a.lat,a.lng],a.z,{duration:.8});
  renderList();
}
function renderSuggest(){
  const q = searchEl.value.trim().toLowerCase();
  if(q.length<2){ hits=[]; closeSuggest(); return; }
  hits = AREAS.filter(a=>a.q.toLowerCase().includes(q)||a.zip.startsWith(q)).slice(0,6);
  suggestEl.innerHTML = hits.length
    ? hits.map((a,i)=>`<button type="button" role="option" id="sg-${i}" aria-selected="false" data-i="${i}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(0.52 0.11 150)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>${esc(a.q)}, CA<span class="zip">${a.zip}</span></button>`).join('')
    : `<button type="button" disabled style="color:var(--ink-3)">No matches — try an OC city or ZIP</button>`;
  suggestEl.classList.add('open');
  searchEl.setAttribute('aria-expanded','true');
  active = -1;
  searchEl.removeAttribute('aria-activedescendant');
}
searchEl.addEventListener('input',renderSuggest);
suggestEl.addEventListener('click',e=>{
  const b = e.target.closest('button[data-i]');
  if(b) goArea(hits[+b.dataset.i]);
});
searchEl.addEventListener('keydown',e=>{
  const open = suggestEl.classList.contains('open') && hits.length;
  if(e.key==='ArrowDown' && open){ e.preventDefault(); setActive(active+1); }
  else if(e.key==='ArrowUp' && open){ e.preventDefault(); setActive(active-1); }
  else if(e.key==='Enter'){
    if(open && active>=0){ e.preventDefault(); goArea(hits[active]); return; }
    const q = searchEl.value.trim().toLowerCase();
    if(!q) return;
    const hit = hits[0] || AREAS.find(a=>a.q.toLowerCase().includes(q)||a.zip.startsWith(q));
    if(hit) goArea(hit);
  }
  else if(e.key==='Escape' && open){ e.stopPropagation(); closeSuggest(); }
});
document.addEventListener('click',e=>{ if(!e.target.closest('.searchwrap')) closeSuggest(); });

/* ============ sheet (mobile): tap to toggle + drag ============ */
const sheet=$('sheet'), sheetHead=$('sheethead');
/* On desktop the head is a static column header, so it only carries button
   semantics at mobile widths where it actually toggles the sheet. */
function applyHeadRole(){
  if(DESKTOP.matches){
    sheetHead.removeAttribute('role');
    sheetHead.removeAttribute('tabindex');
    sheetHead.removeAttribute('aria-expanded');
  } else {
    sheetHead.setAttribute('role','button');
    sheetHead.setAttribute('tabindex','0');
    sheetHead.setAttribute('aria-expanded',String(sheet.classList.contains('open')));
  }
}
function setSheet(open){
  sheet.classList.toggle('open',open);
  if(!DESKTOP.matches) sheetHead.setAttribute('aria-expanded',String(open));
}
function toggleSheet(){ setSheet(!sheet.classList.contains('open')); }

let drag = null;
sheetHead.addEventListener('pointerdown',e=>{
  if(DESKTOP.matches || e.button) return;
  drag = {id:e.pointerId, y:e.clientY, moved:false, open:sheet.classList.contains('open'), base:0};
  drag.base = drag.open ? 0 : sheet.offsetHeight - 56;
  sheetHead.setPointerCapture(e.pointerId);
  sheet.classList.add('dragging');
});
sheetHead.addEventListener('pointermove',e=>{
  if(!drag || e.pointerId!==drag.id) return;
  const dy = e.clientY - drag.y;
  if(Math.abs(dy) > 6) drag.moved = true;
  const max = sheet.offsetHeight - 56;
  sheet.style.transform = `translateY(${Math.max(0, Math.min(max, drag.base + dy))}px)`;
});
function endDrag(e){
  if(!drag || (e && e.pointerId!==drag.id)) return;
  const dy = e ? e.clientY - drag.y : 0;
  sheet.classList.remove('dragging');
  sheet.style.transform = '';
  if(!drag.moved) toggleSheet();
  else if(dy < -40) setSheet(true);
  else if(dy > 40) setSheet(false);
  else setSheet(drag.open);
  drag = null;
}
sheetHead.addEventListener('pointerup',endDrag);
sheetHead.addEventListener('pointercancel',endDrag);
sheetHead.addEventListener('keydown',e=>{
  if(DESKTOP.matches) return;
  if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggleSheet(); }
});

/* ============ global keyboard ============ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('detail').classList.contains('show')) return closeDetail();
    if(filtersOpen()) return closeFilters();
    if(suggestEl.classList.contains('open')) return closeSuggest();
    if(state.selected!==null) return clearSelection();
    if(!DESKTOP.matches && sheet.classList.contains('open')) return setSheet(false);
  }
  if(e.key==='Tab'){
    if($('detail').classList.contains('show')) trap($('detail'),e);
    else if(filtersOpen()) trap($('fpanel'),e);
  }
});

/* ============ responsive plumbing ============ */
DESKTOP.addEventListener('change',()=>{
  setSheet(false);
  applyHeadRole();
  clearSelection();
  closeFilters();
  map.invalidateSize();
});
if('ResizeObserver' in window){
  let raf = 0;
  new ResizeObserver(()=>{
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(()=>map.invalidateSize());
  }).observe($('map'));
} else {
  window.addEventListener('resize',()=>map.invalidateSize());
}

/* ============ init ============ */
applyHeadRole();
syncChips();
renderList();
});
</script>
</body>
