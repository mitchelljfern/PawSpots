<!doctype html>
<!-- Source for the 1200x630 social sharing card. Rendered by tools/build-assets.mjs.
     Uses a system font stack on purpose: the build environment cannot reach Google
     Fonts, and an image that silently falls back mid-render is worse than one that
     never asked. -->
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;background:#f8fbf8;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1b241d;
       display:flex;align-items:center;gap:56px;padding:0 76px;position:relative}
  /* faint map-grid wash, so the card reads as a map product */
  body::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(#dde3dd 1px,transparent 1px),linear-gradient(90deg,#dde3dd 1px,transparent 1px);
    background-size:48px 48px;opacity:.55}
  body::after{content:"";position:absolute;right:-190px;top:-190px;width:620px;height:620px;
    border-radius:50%;background:#e6f3e8;opacity:.75}
  .col{position:relative;z-index:2}
  .lockup{display:flex;align-items:center;gap:20px;margin-bottom:26px}
  .mark{width:96px;height:96px;border-radius:28px;background:#317a45;display:grid;place-items:center}
  h1{font-size:82px;letter-spacing:-.035em;font-weight:800;color:#1b552c;line-height:1}
  p{font-size:37px;line-height:1.24;color:#566158;max-width:19ch;font-weight:450}
  .chips{display:flex;gap:11px;margin-top:36px;max-width:660px}
  .chip{display:flex;align-items:center;gap:9px;border:2px solid #dde3dd;background:#fff;
        border-radius:999px;padding:10px 17px;font-size:21px;font-weight:600;color:#566158;white-space:nowrap}
  .pins{position:relative;z-index:2;width:400px;height:430px;flex:none}
  .pin{position:absolute;display:grid;place-items:center;
       border-radius:50% 50% 50% 6px;box-shadow:0 10px 22px rgba(20,40,25,.22)}
</style>
<div class="col">
  <div class="lockup">
    <span class="mark">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="#fff"><ellipse cx="12" cy="15.8" rx="5.1" ry="4.3"/><circle cx="5.9" cy="10.8" r="2.1"/><circle cx="9.9" cy="7.6" r="2.25"/><circle cx="14.1" cy="7.6" r="2.25"/><circle cx="18.1" cy="10.8" r="2.1"/></svg>
    </span>
    <h1>PawSpots</h1>
  </div>
  <p>Dog-friendly places across California</p>
  <div class="chips">
    <span class="chip">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#317a45" stroke-width="2.1" stroke-linecap="round"><path d="M7 2v8M4 2v5a3 3 0 0 0 6 0V2M7 13v9M17 2c-2 1.5-3 4-3 7v4h3.5M17.5 2v20"/></svg>
      Restaurants &amp; bars</span>
    <span class="chip">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#317a45" stroke-width="2.1" stroke-linecap="round"><path d="M3 19v-7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7M3 19h18M3 19v2M21 19v2M7 10V7h4v3"/><circle cx="7" cy="13.5" r=".5" fill="#317a45"/></svg>
      Hotels</span>
    <span class="chip">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#317a45" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 21h11M9 21v-8h6v8M9 13V9.5a3 3 0 0 1 6 0V13M6.5 14.5h2.5M15 14.5h2.5M10 6.5h4"/></svg>
      Dog parks</span>
  </div>
</div>

<div class="pins">
  <!-- the app's own pin vocabulary: amber paw = featured, green = dogs throughout, white = patio only -->
  <span class="pin" style="width:150px;height:150px;background:#e1a035;left:112px;top:40px">
    <svg width="76" height="76" viewBox="0 0 24 24" fill="#4a3410"><ellipse cx="12" cy="15.8" rx="5.1" ry="4.3"/><circle cx="5.9" cy="10.8" r="2.1"/><circle cx="9.9" cy="7.6" r="2.25"/><circle cx="14.1" cy="7.6" r="2.25"/><circle cx="18.1" cy="10.8" r="2.1"/></svg>
  </span>
  <span class="pin" style="width:104px;height:104px;background:#317a45;left:14px;top:196px">
    <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"><path d="M7 2v8M4 2v5a3 3 0 0 0 6 0V2M7 13v9M17 2c-2 1.5-3 4-3 7v4h3.5M17.5 2v20"/></svg>
  </span>
  <span class="pin" style="width:104px;height:104px;background:#fff;border:5px solid #317a45;left:214px;top:236px">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#317a45" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 21h11M9 21v-8h6v8M9 13V9.5a3 3 0 0 1 6 0V13M6.5 14.5h2.5M15 14.5h2.5M10 6.5h4"/></svg>
  </span>
</div>
